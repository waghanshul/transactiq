name: Nightly demo reset

# Restores the demo data every night so a demo always starts from a known state.
# Needs repository secrets APP_URL (e.g. https://your-app.vercel.app) and RESET_SECRET.
on:
  schedule:
    - cron: "17 21 * * *" # 02:47 IST
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/reset
        env:
          APP_URL: ${{ secrets.APP_URL }}
          RESET_SECRET: ${{ secrets.RESET_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$RESET_SECRET" ]; then
            echo "APP_URL or RESET_SECRET not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $RESET_SECRET" "$APP_URL/api/reset"
